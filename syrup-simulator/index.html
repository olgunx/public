<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syrup Touch Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            height: 100vh;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* The canvas itself */
        canvas.emscripten {
            border: none;
            background-color: black;
            width: 480px;  /* 1.5x of 320 */
            height: 360px; /* 1.5x of 240 */
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            image-rendering: pixelated; /* Keeps it sharp like the real display */
        }

        .sidebar {
            width: 350px;
            background-color: #1e1e24;
            padding: 25px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #4da6ff;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        h2 {
            font-size: 16px;
            margin-top: 25px;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .upload-section {
            background-color: #2a2a35;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .upload-section p {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #cccccc;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 8px;
            background: #121212;
            border: 1px solid #444;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        button.action-btn {
            background-color: #4da6ff;
            color: #121212;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: background 0.2s;
        }

        button.action-btn:hover {
            background-color: #66b3ff;
        }

        .status {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }

        #output {
            width: 100%;
            height: 150px;
            margin-top: 15px;
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            resize: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
            <div class="status" id="status">Downloading...</div>
        </div>

        <div class="sidebar">
            <h1>Syrup Touch</h1>
            <p style="font-size: 14px; color: #aaa;">WebAssembly Simulator</p>

            <h2>Configuration Upload</h2>
            
            <div class="upload-section">
                <p><strong>1. UI Colors (ui_colors.json)</strong></p>
                <input type="file" id="upload-ui-colors" accept=".json">
            </div>

            <div class="upload-section">
                <p><strong>2. Mixes (syrup_mixes.json)</strong></p>
                <input type="file" id="upload-mixes" accept=".json">
            </div>

            <div class="upload-section">
                <p><strong>3. Translations (ui_translations.csv)</strong></p>
                <input type="file" id="upload-translations" accept=".csv">
            </div>

            <button class="action-btn" onclick="applyConfigs()">Apply & Reload Simulator</button>

            <h2>Console Output</h2>
            <textarea id="output" readonly></textarea>
        </div>
    </div>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var outputElement = document.getElementById('output');

        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (outputElement) {
                        outputElement.value += text + "\n";
                        outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
                    }
                };
            })(),
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                if (m) {
                    text = m[1];
                }
                statusElement.innerHTML = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };
        Module.setStatus('Downloading...');
        window.onerror = function(event) {
            Module.setStatus('Exception thrown, see JavaScript console');
            Module.setStatus = function(text) {
                if (text) Module.printErr('[post-exception status] ' + text);
            };
        };

        // Configuration handling
        function readFileAsync(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(new Uint8Array(e.target.result));
                reader.onerror = (e) => reject(e);
                reader.readAsArrayBuffer(file);
            });
        }

        async function applyConfigs() {
            try {
                let anyUploaded = false;

                const uiColorsFile = document.getElementById('upload-ui-colors').files[0];
                if (uiColorsFile) {
                    const data = await readFileAsync(uiColorsFile);
                    FS.writeFile('/data/ui_colors.json', data);
                    Module.print("Uploaded ui_colors.json");
                    anyUploaded = true;
                }

                const mixesFile = document.getElementById('upload-mixes').files[0];
                if (mixesFile) {
                    const data = await readFileAsync(mixesFile);
                    FS.writeFile('/data/syrup_mixes.json', data);
                    Module.print("Uploaded syrup_mixes.json");
                    anyUploaded = true;
                }

                const translationsFile = document.getElementById('upload-translations').files[0];
                if (translationsFile) {
                    const data = await readFileAsync(translationsFile);
                    FS.writeFile('/data/ui_translations.csv', data);
                    Module.print("Uploaded ui_translations.csv");
                    anyUploaded = true;
                }

                if (anyUploaded) {
                    // Call the C++ function exported via EMSCRIPTEN_KEEPALIVE
                    Module.ccall('sim_reload_config', 'v', [], []);
                    Module.print("Simulator configuration reloaded successfully!");
                } else {
                    Module.print("No files selected to upload.");
                }
            } catch (err) {
                Module.printErr("Error uploading files: " + err.message);
                alert("Error applying configurations. Check console.");
            }
        }
    </script>
    <script async type="text/javascript" src="simulator.js"></script>
</body>
</html>
